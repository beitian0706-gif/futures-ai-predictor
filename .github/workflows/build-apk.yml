name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Unzip original Android source
        run: |
          unzip -o futures_ai_android_v0.4_source.zip -d source
          find source -name settings.gradle -o -name settings.gradle.kts
      - name: Apply V0.4.1 changes
        run: |
          PROJECT=$(find source -name settings.gradle -o -name settings.gradle.kts | head -1)
          test -n "$PROJECT"
          PROJECT_DIR=$(dirname "$PROJECT")
          mkdir -p "$PROJECT_DIR/app/src/main/assets"
          cp v0.4.1/app/src/main/assets/index.html "$PROJECT_DIR/app/src/main/assets/index.html"
          cp v0.4.1/app/build.gradle "$PROJECT_DIR/app/build.gradle"
          grep -q "0.4.1" "$PROJECT_DIR/app/build.gradle"
          grep -q "combined_score" "$PROJECT_DIR/app/src/main/assets/index.html"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: |
          PROJECT=$(find source -name settings.gradle -o -name settings.gradle.kts | head -1)
          test -n "$PROJECT"
          cd "$(dirname "$PROJECT")"
          gradle --no-daemon assembleDebug
      - name: Verify APK contents
        run: |
          PROJECT=$(find source -name settings.gradle -o -name settings.gradle.kts | head -1)
          PROJECT_DIR=$(dirname "$PROJECT")
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | tee apk-contents.txt
          grep -q 'classes.dex' apk-contents.txt
          grep -q 'assets/index.html' apk-contents.txt
          grep -q 'AndroidManifest.xml' apk-contents.txt
          echo "APK bytes: $(wc -c < "$APK")"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: futures-ai-v0.4.1-debug-apk
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
