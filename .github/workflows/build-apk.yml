name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      -name: Install Android SDK components
  run: |
    yes | sdkmanager --licenses || true
    sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Unzip source
        run: |
          unzip -o futures_ai_android_v0.4_source.zip -d source
          find source -name settings.gradle -o -name settings.gradle.kts
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: |
          PROJECT=$(find source -name settings.gradle -o -name settings.gradle.kts | head -1)
          cd "$(dirname "$PROJECT")"
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: futures-ai-apk
          path: source/**/build/outputs/apk/debug/*.apk
