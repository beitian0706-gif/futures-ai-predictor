
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v0.4.1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unzip Android source
        run: |
          unzip -o futures_ai_android_v0.4_source.zip -d source
          find source -name settings.gradle -o -name settings.gradle.kts

      - name: Apply V0.4.1 connection fixes
        run: |
          PROJECT=$(find source -name settings.gradle | head -1)
          test -n "$PROJECT"
          cp v0.4.1/apply_patch.py "$(dirname "$PROJECT")/apply_patch.py"
          python "$(dirname "$PROJECT")/apply_patch.py"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT=$(find source -name settings.gradle -o -name settings.gradle.kts | head -1)
          test -n "$PROJECT"
          cd "$(dirname "$PROJECT")"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: futures-ai-v0.4.1-apk
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
