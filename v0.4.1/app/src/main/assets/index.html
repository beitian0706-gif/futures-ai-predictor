<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>期货智研 AI · V0.4.2</title><style>
:root{font-family:system-ui,sans-serif;color:#e8f1ff;background:#0c1525}*{box-sizing:border-box}body{margin:0;padding:18px 16px 70px;max-width:700px;margin:auto}h1{font-size:23px;margin:10px 0 2px}.sub{font-size:12px;color:#99aac2}.card{background:#19263b;border:1px solid #2a3b55;border-radius:16px;padding:16px;margin:14px 0}label{display:block;color:#a7b9d1;font-size:13px;margin:10px 0 6px}input,select{width:100%;padding:12px;border:1px solid #40516a;border-radius:10px;background:#101c30;color:white;font-size:15px}button{background:#347bde;border:0;border-radius:10px;color:white;font-weight:600;padding:12px 16px;margin-top:12px;width:100%}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.metric{background:#102038;padding:12px;border-radius:10px}.metric strong{display:block;font-size:19px;margin-top:6px}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:#d3e1f4;line-height:1.65}.warning{color:#e9bf72}.ok{color:#7ee3bc}#result{display:none}small{color:#a5b5ca}canvas{background:#102038;border-radius:10px}details{color:#b6c8df}summary{cursor:pointer;padding:8px 0}nav{position:fixed;bottom:0;left:0;right:0;background:#111e30;border-top:1px solid #2d3c53;padding:12px;text-align:center;color:#a6c7f7}
</style></head><body>
<div class="sub">FUTURES INTELLIGENCE · V0.4.1</div><h1>期货智研 AI</h1><div class="sub">中国期货 · 主力候选 · 综合分析</div>
<div class="card"><label>分析服务器地址（已预置，可按需修改）</label><input id="server" placeholder="例如 http://192.168.1.20:8000"/><button onclick="connect()">检测连接</button><div id="connection" class="sub" style="margin-top:8px">尚未连接</div></div>
<div class="card"><label>品种名称</label><input id="product" value="螺纹钢"/><button onclick="loadContracts()">查询合约与主力候选</button><label>具体合约（可手动输入，不能使用连续合约）</label><input id="contract" placeholder="请先查询合约"/><div id="contracts" class="sub" style="margin-top:8px"></div><button onclick="analyze()">开始综合分析</button></div>
<div id="result" class="card"><h3 id="heading">分析结果</h3><div class="row"><div class="metric"><small>综合评分</small><strong id="score">—</strong></div><div class="metric"><small>模型方向</small><strong id="bias">—</strong></div></div><p id="note" class="warning"></p><div class="metric" style="margin:10px 0"><small>历史日线价格（非实时）</small><strong id="price">—</strong></div><h3>历史日线走势图</h3><canvas id="chart" style="width:100%;height:210px;display:block" aria-label="历史收盘价和MA20走势图"></canvas><div id="chartNote" class="sub"></div><h3>AI 中文分析报告</h3><div id="summary" style="line-height:1.8"></div><h3>关键技术指标</h3><div id="indicators" class="sub" style="line-height:2"></div><details style="margin-top:14px"><summary>技术详情 · 原始数据</summary><pre id="report"></pre></details></div>
<div class="card"><b>60分钟 MA144</b><p class="sub">V0.3 已支持通过CSV研究历史穿越信号。本安卓版本尚未实现实时60分钟行情推送。</p></div>
<div class="sub">行情可能延迟，分析仅供研究参考，不自动交易；没有经过样本外验证的上涨概率不会展示。</div><nav>行情分析 · 研究工具 · 设置</nav>
<script>
const UI_BUILD='0.4.2-20261112';
const $=id=>document.getElementById(id);
const DEFAULT_SERVER='http://110.42.130.206';
document.body.insertAdjacentHTML('afterbegin','<div style="font-size:12px;color:#8ab4f8;text-align:right;padding:3px 0">界面版本 V0.4.2 · 中文报告版</div>');
$('server').value=localStorage.getItem('futures_server')||DEFAULT_SERVER;
$('server').addEventListener('change',()=>localStorage.setItem('futures_server',$('server').value.trim()));
function base(){return $('server').value.trim().replace(/\/+$/,'')}
function msg(id,s){$(id).textContent=s}
async function request(path,opts){if(!base())throw Error('请先填写分析服务器地址');const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),15000);try{const r=await fetch(base()+path,{...opts,signal:ctrl.signal});const t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('服务器返回非JSON内容')}if(!r.ok)throw Error(typeof j.detail==='string'?j.detail:'HTTP '+r.status);return j}catch(e){if(e.name==='AbortError')throw Error('请求超时，请检查行情源或服务器');throw e}finally{clearTimeout(timer)}}
async function connect(){msg('connection','连接中…');try{let j=await request('/health');msg('connection','连接成功 · 服务版本 '+j.version)}catch(e){msg('connection','连接失败：'+e.message)}}
async function loadContracts(){msg('contracts','查询中…');try{const j=await request('/contracts?product='+encodeURIComponent($('product').value.trim()));const arr=j.contracts||[];if(j.main_candidate)$('contract').value=j.main_candidate;msg('contracts','候选主力：'+(j.main_candidate||'未确认')+'；返回合约数：'+arr.length+'。仅按持仓量排序，尚未确认实际主力，请核验交易所与合约月份。')}catch(e){msg('contracts','查询失败：'+e.message)}}
function n(v,d=2){return typeof v==='number'&&Number.isFinite(v)?v.toFixed(d):'暂无'}
function drawChart(rows){const c=$('chart'),rect=c.getBoundingClientRect(),w=Math.max(280,Math.floor(rect.width)),h=210,ratio=window.devicePixelRatio||1;c.width=w*ratio;c.height=h*ratio;const x=c.getContext('2d');x.scale(ratio,ratio);x.clearRect(0,0,w,h);const vals=rows.map(r=>Number(r.close)).filter(Number.isFinite);if(vals.length<2){msg('chartNote','有效数据不足，无法绘图');return}const ma=rows.map((r,i)=>i>=19?rows.slice(i-19,i+1).reduce((a,b)=>a+Number(b.close),0)/20:null);const all=vals.concat(ma.filter(v=>v!==null));const lo=Math.min(...all),hi=Math.max(...all),span=hi-lo||1;const left=43,right=w-12,top=12,bottom=h-26;const px=i=>left+(right-left)*i/(rows.length-1);const py=v=>bottom-(v-lo)/span*(bottom-top);x.font='11px sans-serif';x.strokeStyle='#31435d';x.fillStyle='#9fb1c8';for(let k=0;k<4;k++){const v=lo+span*k/3,y=py(v);x.beginPath();x.moveTo(left,y);x.lineTo(right,y);x.stroke();x.fillText(v.toFixed(0),3,y+3)}function line(data,color){x.beginPath();x.strokeStyle=color;x.lineWidth=2;let started=false;data.forEach((v,i)=>{if(v===null||!Number.isFinite(v)){started=false;return}if(!started){x.moveTo(px(i),py(v));started=true}else x.lineTo(px(i),py(v))});x.stroke()}line(rows.map(r=>Number(r.close)),'#72b7ff');line(ma,'#ffbf69');x.fillStyle='#9fb1c8';x.fillText('收盘价',left,bottom+17);x.fillStyle='#ffbf69';x.fillText('MA20',left+55,bottom+17);msg('chartNote','来源：AKShare/Sina · 历史日线 · 非实时；图表仅展示已取得的K线')}
async function analyze(){msg('note','正在请求历史数据并分析…');$('result').style.display='block';for(const id of ['report','summary','indicators','chartNote'])msg(id,'');for(const id of ['score','bias','price'])msg(id,'—');const c=$('chart').getContext('2d');c.clearRect(0,0,$('chart').width,$('chart').height);try{const code=$('contract').value.trim().toUpperCase();if(!/^[A-Z0-9_]+$/.test(code))throw Error('请填写有效具体合约代码');const j=await request('/analyze-contract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contract:code})});msg('heading',code+' · 综合分析');const score=j.combined_score??j.total_score??j.composite_score??j.score;msg('score',n(score,3));const bias=j.bias==='bearish'?'偏空':j.bias==='bullish'?'偏多':'中性 / 未知';msg('bias',bias);msg('price',n(j.last_price));msg('note','数据周期：历史日线 · 获取时间：'+(j.retrieved_at||'未知')+' · 不代表实时行情');const missing=(j.factor_scores&&['fundamental','sentiment'].filter(k=>j.factor_scores[k]===null))||[];msg('summary','模型方向：'+bias+'。综合评分 '+n(score,3)+'。'+(missing.length?'基本面或情绪因子缺失，评分覆盖不完整。':'')+'当前仅有历史日线分析，未验证60分钟MA144收盘穿越信号，因此不构成可执行的入场指令。请结合最新行情、风险控制及交易所合约信息核实。');msg('indicators','MA20：'+n(j.ma20)+'　EMA12：'+n(j.ema12)+'　EMA26：'+n(j.ema26)+'　成交量比率：'+n(j.volume_ratio,3)+'　持仓变化：'+n(j.open_interest_change,3));msg('report',JSON.stringify(j,null,2));try{const bars=await request('/candles/'+encodeURIComponent(code)+'?limit=180');drawChart(bars.candles||[])}catch(err){msg('chartNote','走势图暂不可用：'+err.message+'。分析报告已保留。')}}catch(e){msg('note','分析失败：'+e.message);msg('summary','本次没有生成有效分析结果，请检查合约代码、行情源与网络连接。')}}
</script></body></html>
